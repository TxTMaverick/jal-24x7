# Render blueprint for JAL 24x7.
#
# Deploys both services on Render's free plan and wires them to each other:
#   * the frontend is told the API hostname at build time
#   * the backend is told the frontend hostname for its CORS allow-list
#
# No region is pinned, so Render uses the account default. Pinning a region
# that an account cannot use makes the whole blueprint fail to apply.
#
# To deploy: push to GitHub, then on render.com choose New + > Blueprint.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: jal24x7-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # OTP is shown on screen rather than sent by SMS.
      - key: DEMO_MODE
        value: "true"

      - key: RATE_LIMIT_ENABLED
        value: "true"

      # Render generates this and keeps it out of the repository.
      - key: JWT_SECRET
        generateValue: true

      # SQLite on the instance disk. The catalogue, suppliers, drivers and
      # helplines reseed on every boot, so the site is never empty. Orders do
      # not survive a restart; attach a Render Postgres and point this at its
      # Internal Database URL (prefix postgresql+psycopg://) to change that.
      - key: DATABASE_URL
        value: "sqlite:///./jal24x7.db"

      # Locked to the deployed frontend. Never "*" with credentials enabled.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: jal24x7-web
          property: host

  # --------------------------------------------------------------- frontend
  - type: web
    name: jal24x7-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --port $PORT --hostname 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: "22"

      # A Next.js build is memory hungry and the free instance has 512 MB.
      # Capping the old-space keeps V8 garbage collecting instead of being
      # killed by the OOM reaper part way through the build.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"

      # NEXT_PUBLIC_* is inlined at build time, so this must exist during the
      # build, not just at runtime. Render resolves it to the API's hostname
      # and the API client prefixes https:// itself.
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: jal24x7-api
          property: host
