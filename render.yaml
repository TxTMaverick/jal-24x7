# Render blueprint for the JAL 24x7 API.
#
# Only the backend lives here. The Next.js frontend is deployed on Vercel,
# which is free, has no cold start, and is purpose-built for Next.
#
# Why the split matters: Render's free plan allows 750 instance hours per
# month per workspace, and a calendar month is about 730 hours. Two services
# would need ~1460 and blow the budget in a fortnight. One service fits, with
# room to spare, which is what makes it possible to keep it awake around the
# clock (see .github/workflows/keep-alive.yml) instead of paying a 60 second
# cold start on every visit.
#
# To deploy: push to GitHub, then on render.com choose New + > Blueprint.

services:
  - type: web
    name: jal24x7-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # OTP is shown on screen rather than sent by SMS.
      - key: DEMO_MODE
        value: "true"

      - key: RATE_LIMIT_ENABLED
        value: "true"

      # Render generates this and keeps it out of the repository.
      - key: JWT_SECRET
        generateValue: true

      # Defaults to SQLite on the instance disk, which is wiped on every
      # redeploy: the catalogue reseeds, but placed orders do not survive.
      #
      # For persistence use a free Neon Postgres (neon.tech) and paste its
      # connection string here verbatim; config.py rewrites the prefix to
      # postgresql+psycopg:// to match the driver in requirements.txt. Neon
      # resumes from idle in well under a second and, unlike Supabase, never
      # pauses the project outright. Left blank, this falls back to SQLite.
      - key: DATABASE_URL
        sync: false

      # The deployed frontend origin, for the CORS allow-list. Set this to the
      # Vercel URL, e.g. https://jal-24x7.vercel.app. Never "*" with
      # credentials enabled. Render prompts for it because the frontend is no
      # longer a service in this blueprint for it to reference.
      - key: CORS_ORIGINS
        sync: false
