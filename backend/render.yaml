# Render.com blueprint. Push this repo to GitHub, then in Render choose
# "New +" > "Blueprint" and point it at the repo. Free tier, no card needed.
services:
  - type: web
    name: jal24x7-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Set this to your Vercel URL once the frontend is deployed.
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
