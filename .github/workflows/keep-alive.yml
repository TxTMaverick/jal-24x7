# Keeps the free Render API instance awake.
#
# Render's free plan spins a web service down after 15 minutes with no
# traffic, and the next visitor then waits most of a minute for it to boot.
# Pinging /health on a schedule keeps it warm, so the site is fast for
# everyone instead of only for whoever happened to arrive second.
#
# This stays inside the free allowances on both sides:
#   * Render gives 750 instance hours a month and a month is about 730, so a
#     single always-on service fits. This is why the frontend moved to Vercel
#     -- two Render services would have needed roughly 1460 hours.
#   * GitHub Actions is free and unlimited for public repositories.
#
# Two caveats worth knowing:
#   * GitHub disables scheduled workflows on repositories with no activity
#     for 60 days. It emails first, and any push re-enables them.
#   * Scheduled runs are queued, not guaranteed on the minute, and can be
#     several minutes late when GitHub is busy. The interval below is well
#     inside the 15 minute idle window to absorb that.

name: Keep API awake

on:
  schedule:
    # Every 10 minutes, leaving margin against the 15 minute spin-down.
    - cron: "*/10 * * * *"
  # Lets you confirm it works without waiting for the next slot.
  workflow_dispatch:

# If a run is somehow still going when the next fires, drop the new one
# rather than piling requests up.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          # Set this to your Render URL under
          # Settings > Secrets and variables > Actions > Variables.
          # Falls back to the default hostname so a fresh clone still works.
          API_URL: ${{ vars.API_URL || 'https://jal24x7-api.onrender.com' }}
        run: |
          echo "Pinging $API_URL/health"

          # A sleeping instance can take most of a minute to answer, so allow
          # for that rather than calling a cold start a failure. Retry a few
          # times before giving up.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                        --max-time 90 "$API_URL/health" || echo "000")

            if [ "$code" = "200" ]; then
              echo "OK ($code): $(cat /tmp/body.txt)"
              exit 0
            fi

            echo "Attempt $attempt returned $code, retrying..."
            sleep 15
          done

          echo "API did not respond after 3 attempts."
          cat /tmp/body.txt || true
          exit 1
